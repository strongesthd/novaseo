name: Deploy NovaSEO production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novaseo-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: novaseo-production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'Missing secret: VPS_HOST'; exit 1; }
          test -n "$VPS_USER" || { echo 'Missing secret: VPS_USER'; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo 'Missing secret: VPS_SSH_KEY'; exit 1; }
          test -n "$VPS_SSH_PORT" || { echo 'Missing secret: VPS_SSH_PORT'; exit 1; }

      - name: Prepare deploy package
        run: |
          set -euo pipefail
          mkdir -p deploy_dist
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude '.env' \
            --exclude '*.log' \
            --exclude 'deploy_dist/' \
            ./ deploy_dist/
          tar -C deploy_dist -czf novaseo-deploy.tgz .
          ls -lh novaseo-deploy.tgz

      - name: Upload package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: novaseo-deploy.tgz
          target: /tmp/novaseo-upload-${{ github.run_id }}
          rm: true
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      - name: Deploy and verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            APP_DIR=/home/app/novaseo
            UPLOAD_DIR=/tmp/novaseo-upload-${{ github.run_id }}
            PACKAGE="$UPLOAD_DIR/novaseo-deploy.tgz"
            if [ ! -f "$PACKAGE" ]; then
              PACKAGE="$UPLOAD_DIR/novaseo-deploy.tgz/novaseo-deploy.tgz"
            fi
            test -f "$PACKAGE"

            mkdir -p "$APP_DIR"
            test -f "$APP_DIR/.env" || { echo "Missing required runtime file: $APP_DIR/.env"; exit 1; }

            BACKUP_DIR=$(mktemp -d /tmp/novaseo-deploy.XXXXXX)
            cp "$APP_DIR/.env" "$BACKUP_DIR/.env"
            find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
            tar -xzf "$PACKAGE" -C "$APP_DIR"
            cp "$BACKUP_DIR/.env" "$APP_DIR/.env"
            rm -rf "$BACKUP_DIR"

            cd "$APP_DIR"
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate --remove-orphans

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3009/health >/dev/null; then
                rm -rf "$UPLOAD_DIR"
                docker image prune -f
                echo 'Deploy done'
                exit 0
              fi
              sleep 3
            done

            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail 100 api worker migrate || true
            exit 1
