name: Deploy NovaSEO production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novaseo-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: novaseo-production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'Missing secret: VPS_HOST'; exit 1; }
          test -n "$VPS_USER" || { echo 'Missing secret: VPS_USER'; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo 'Missing secret: VPS_SSH_KEY'; exit 1; }
          test -n "$VPS_SSH_PORT" || { echo 'Missing secret: VPS_SSH_PORT'; exit 1; }

      - name: Prepare deploy package
        run: |
          set -euo pipefail
          mkdir -p deploy_dist
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude '.env' \
            --exclude '*.log' \
            --exclude 'deploy_dist/' \
            ./ deploy_dist/
          tar -C deploy_dist -czf novaseo-deploy.tgz .
          ls -lh novaseo-deploy.tgz

      - name: Upload package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: novaseo-deploy.tgz
          target: /tmp/novaseo-upload-${{ github.run_id }}
          rm: true
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      - name: Deploy and verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            APP_DIR=/home/app/novaseo
            RELEASE_DIR="$APP_DIR/releases/${{ github.run_id }}-${{ github.run_attempt }}"
            UPLOAD_DIR=/tmp/novaseo-upload-${{ github.run_id }}
            PACKAGE="$UPLOAD_DIR/novaseo-deploy.tgz"
            if [ ! -f "$PACKAGE" ]; then
              PACKAGE="$UPLOAD_DIR/novaseo-deploy.tgz/novaseo-deploy.tgz"
            fi
            test -f "$PACKAGE"

            mkdir -p "$APP_DIR"
            test -f "$APP_DIR/.env" || { echo "Missing required runtime file: $APP_DIR/.env"; exit 1; }

            mkdir -p "$APP_DIR/releases"
            mkdir "$RELEASE_DIR"
            tar -xzf "$PACKAGE" -C "$RELEASE_DIR"

            python3 "$RELEASE_DIR/deploy/normalize-production-env.py" "$APP_DIR/.env"

            COMPOSE_FILE="$RELEASE_DIR/docker-compose.prod.yml"
            docker compose --project-name novaseo --env-file "$APP_DIR/.env" -f "$COMPOSE_FILE" config --quiet
            if ! docker compose --project-name novaseo --env-file "$APP_DIR/.env" -f "$COMPOSE_FILE" up -d --build --force-recreate 2>&1; then
              echo "docker compose up failed, dumping logs:"
              docker compose --project-name novaseo --env-file "$APP_DIR/.env" -f "$COMPOSE_FILE" ps -a || true
              docker compose --project-name novaseo --env-file "$APP_DIR/.env" -f "$COMPOSE_FILE" logs --tail 100 migrate postgres redis || true
              exit 1
            fi

            READY=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3009/health >/dev/null \
                && curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3010/health >/dev/null \
                && curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3010/ | grep -q 'id="root"'; then
                READY=1
                break
              fi
              sleep 3
            done

            if [ "$READY" -ne 1 ]; then
              docker compose --project-name novaseo --env-file "$APP_DIR/.env" -f "$COMPOSE_FILE" ps
              docker compose --project-name novaseo --env-file "$APP_DIR/.env" -f "$COMPOSE_FILE" logs --tail 100 api web worker migrate || true
              exit 1
            fi

            NGINX_SITE=/etc/nginx/sites-available/novaseo.novatechhp.vn
            test -f "$NGINX_SITE" || { echo "Missing Nginx site: $NGINX_SITE"; exit 1; }
            NGINX_BACKUP=$(mktemp "$APP_DIR/.nginx-novaseo.XXXXXX")
            if ! sudo -n cp "$NGINX_SITE" "$NGINX_BACKUP"; then
              rm -f "$NGINX_BACKUP"
              exit 1
            fi
            rollback_nginx() {
              sudo -n install -m 644 "$NGINX_BACKUP" "$NGINX_SITE"
              sudo -n nginx -t
              sudo -n systemctl reload nginx
              rm -f "$NGINX_BACKUP"
            }
            if ! sudo -n install -m 644 "$RELEASE_DIR/deploy/nginx-novaseo.conf" "$NGINX_SITE"; then
              rollback_nginx
              exit 1
            fi
            if ! sudo -n nginx -t; then
              rollback_nginx
              exit 1
            fi
            if ! sudo -n systemctl reload nginx; then
              rollback_nginx
              exit 1
            fi

            VERIFY_BODY=$(mktemp "$APP_DIR/.novaseo-dashboard.XXXXXX")
            DASHBOARD_READY=0
            for attempt in $(seq 1 10); do
              if curl --noproxy '*' --fail --silent --max-time 10 \
                --resolve novaseo.novatechhp.vn:443:127.0.0.1 \
                --output "$VERIFY_BODY" \
                https://novaseo.novatechhp.vn/ \
                && grep -q 'id="root"' "$VERIFY_BODY"; then
                DASHBOARD_READY=1
                break
              fi
              sleep 1
            done
            rm -f "$VERIFY_BODY"
            if [ "$DASHBOARD_READY" -ne 1 ]; then
              rollback_nginx
              exit 1
            fi

            if ! curl --noproxy '*' --fail --silent --show-error --max-time 10 \
              --resolve novaseo.novatechhp.vn:443:127.0.0.1 \
              https://novaseo.novatechhp.vn/api/v1/auth/setup-status | grep -q '"hasOwner"'; then
              echo 'Dashboard is live but auth API verification failed'
              rollback_nginx
              exit 1
            fi

            rm -f "$NGINX_BACKUP"
            rm -rf "$UPLOAD_DIR"
            echo 'Deploy done'
