name: Deploy NovaSEO production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novaseo-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: novaseo-production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'Missing secret: VPS_HOST'; exit 1; }
          test -n "$VPS_USER" || { echo 'Missing secret: VPS_USER'; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo 'Missing secret: VPS_SSH_KEY'; exit 1; }
          test -n "$VPS_SSH_PORT" || { echo 'Missing secret: VPS_SSH_PORT'; exit 1; }

      - name: Prepare deploy package
        run: |
          set -euo pipefail
          mkdir -p deploy_dist
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude '.env' \
            --exclude '*.log' \
            --exclude 'deploy_dist/' \
            ./ deploy_dist/
          tar -C deploy_dist -czf novaseo-deploy.tgz .
          ls -lh novaseo-deploy.tgz

      - name: Upload package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: novaseo-deploy.tgz
          target: /tmp/novaseo-upload-${{ github.run_id }}
          rm: true
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      - name: Deploy and verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            APP_DIR=/home/app/novaseo
            RELEASE_DIR="$APP_DIR/releases/${{ github.run_id }}-${{ github.run_attempt }}"
            UPLOAD_DIR=/tmp/novaseo-upload-${{ github.run_id }}
            PACKAGE="$UPLOAD_DIR/novaseo-deploy.tgz"
            if [ ! -f "$PACKAGE" ]; then
              PACKAGE="$UPLOAD_DIR/novaseo-deploy.tgz/novaseo-deploy.tgz"
            fi
            test -f "$PACKAGE"

            mkdir -p "$APP_DIR"
            test -f "$APP_DIR/.env" || { echo "Missing required runtime file: $APP_DIR/.env"; exit 1; }

            python3 - "$APP_DIR/.env" <<'PY'
            import os
            import pathlib
            import stat
            import sys
            import tempfile

            path = pathlib.Path(sys.argv[1])
            keys = (b"DB_PASSWORD", b"REDIS_PASSWORD", b"JWT_SECRET", b"ENCRYPTION_KEY")
            if path.is_symlink():
                raise SystemExit("Runtime environment file must not be a symlink")

            source = path.read_bytes()
            lines = source.splitlines(keepends=True)
            found = set()
            output = []
            changed = False

            for line in lines:
                content = line.rstrip(b"\r\n")
                ending = line[len(content):]
                key = next((item for item in keys if content.startswith(item + b"=")), None)
                if key is None:
                    output.append(line)
                    continue

                if key in found:
                    raise SystemExit(f"Duplicate {key.decode()} in runtime environment file")
                found.add(key)
                value = content[len(key) + 1:]
                if len(value) >= 2 and value.startswith(b"'") and value.endswith(b"'"):
                    output.append(line)
                    continue
                if (
                    not value
                    or value.startswith((b"'", b'"', b"#"))
                    or value.endswith((b"'", b'"'))
                    or b"'" in value
                    or value != value.strip()
                    or b" #" in value
                    or b"\t#" in value
                ):
                    raise SystemExit(f"Cannot safely normalize {key.decode()} in runtime environment file")

                output.append(key + b"='" + value + b"'" + ending)
                changed = True

            missing = set(keys) - found
            if missing:
                raise SystemExit(
                    "Missing runtime environment keys: "
                    + ", ".join(key.decode() for key in sorted(missing))
                )

            if changed:
                info = path.stat()
                descriptor, temporary = tempfile.mkstemp(prefix=".env.", dir=path.parent)
                try:
                    with os.fdopen(descriptor, "wb") as target:
                        target.write(b"".join(output))
                        target.flush()
                        os.fsync(target.fileno())
                    os.chmod(temporary, stat.S_IRUSR | stat.S_IWUSR)
                    os.chown(temporary, info.st_uid, info.st_gid)
                    os.replace(temporary, path)
                except BaseException:
                    try:
                        os.unlink(temporary)
                    except FileNotFoundError:
                        pass
                    raise
                print("Normalized runtime secret quoting without changing secret values")
            PY

            mkdir -p "$APP_DIR/releases"
            mkdir "$RELEASE_DIR"
            tar -xzf "$PACKAGE" -C "$RELEASE_DIR"

            COMPOSE_FILE="$RELEASE_DIR/docker-compose.prod.yml"
            docker compose --project-name novaseo --env-file "$APP_DIR/.env" -f "$COMPOSE_FILE" config --quiet
            if ! docker compose --project-name novaseo --env-file "$APP_DIR/.env" -f "$COMPOSE_FILE" up -d --build --force-recreate 2>&1; then
              echo "docker compose up failed, dumping logs:"
              docker compose --project-name novaseo --env-file "$APP_DIR/.env" -f "$COMPOSE_FILE" ps -a || true
              docker compose --project-name novaseo --env-file "$APP_DIR/.env" -f "$COMPOSE_FILE" logs --tail 100 migrate postgres redis || true
              exit 1
            fi

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3009/health >/dev/null; then
                rm -rf "$UPLOAD_DIR"
                echo 'Deploy done'
                exit 0
              fi
              sleep 3
            done

            docker compose --project-name novaseo --env-file "$APP_DIR/.env" -f "$COMPOSE_FILE" ps
            docker compose --project-name novaseo --env-file "$APP_DIR/.env" -f "$COMPOSE_FILE" logs --tail 100 api worker migrate || true
            exit 1
